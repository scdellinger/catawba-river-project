# models to build
#   - int_discharge_readings

version: 2

models:
  - name: int_discharge_readings
    description: "stg_raw_readings filtered down to just parameter code 00060. Also added a column to flag if the reading is within hurricane season."
    columns:
      - name: time_series_id
        description: "This is the unique identifier for parameter, calculation type, and location for this reading."
        tests:
          - not_null
      - name: monitoring_location_id
        description: "This is the identifier for the gauge located as Pleasant Gardens - NC."
      - name: location_description
        description: "This is the verbal description of the monitoring location."
      - name: parameter_code
        description: "This is the code what what is being measured."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('parameter_codes')
                field: parameter_code
          - accepted_values:
              arguments:
                values: ['00060']
      - name: parameter_description
        description: "This is the verbal description of what is being measured"
        tests:
          - not_null
      - name: statistic_id
        description: "This is the identifier of how the measurement is calculated."
      - name: statistical_description
        description: "This is the verbal description of how the measurement is being calculated."
      - name: time
        description: "This is the timestamp of the reading for this row."
      - name: value
        description: "This is the value of the reading for this row."
      - name: unit_of_measure
        description: "This is the unit of measure for the reading of this row."
      - name: approval_status
        description: "This is the approval status of the reading for this row."
      - name: qualifier
        description: "This lists any qualifiers for the reading for this row."
      - name: last_modified
        description: "This is the timestamp for the last time this reading was modified."
      - name: longitude
        description: "This is the longitudinal value of the gauge position."
      - name: latitude
        description: "This is the latitudinal value of the gauge position."
      - name: feature_id
        description: "This the unique address for this reading for look up by USGS database."
      - name: is_hurricane_season
        description: "Adds a true/false flag on whether this reading falls within hurricane season or not."
        tests:
          - not_null
